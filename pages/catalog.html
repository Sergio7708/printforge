<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог — PrintForge</title>
  <meta name="description" content="Полный каталог 3D печатных моделей PrintForge.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css?v=1">
</head>
<body>
  <header class="header">
    <div class="container">
      <a href="../index.html" class="logo">Print<span>Forge</span></a>
      <nav class="nav">
        <a href="../index.html">Главная</a>
        <a href="catalog.html" class="active">Каталог</a>
        <a href="../index.html#about">О нас</a>
        <a href="../index.html#contact">Контакты</a>
      </nav>
      <div class="header-right">
        <div class="search-bar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="search-input" placeholder="Поиск товаров...">
        </div>
        <div class="cart-btn" onclick="PF.toggleCart(true)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          <span class="cart-badge">0</span>
        </div>
      </div>
    </div>
  </header>

  <div class="breadcrumbs"><div class="container"><a href="../index.html">Главная</a><span>/</span>Каталог</div></div>

  <section class="section" style="padding-top:24px">
    <div class="container">
      <h1 style="font-family:var(--font-heading);font-size:36px;margin-bottom:8px">Каталог</h1>
      <p id="products-count" style="color:var(--text-muted);margin-bottom:32px">20 товаров</p>
      <div class="filter-bar">
        <div class="filter-buttons" id="filter-buttons"></div>
        <select class="sort-select" id="sort-select" onchange="PF.sortProducts(this.value)">
          <option value="popular">По популярности</option>
          <option value="price-asc">Цена ↑</option>
          <option value="price-desc">Цена ↓</option>
          <option value="name">По имени</option>
        </select>
      </div>
      <div class="products-grid" id="products-grid"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <span>© 2026 PrintForge</span>
        <a href="orders.html" style="color:var(--gold)">Мои заказы</a>
      </div>
    </div>
  </footer>

  <div class="cart-overlay" id="cart-overlay"></div>
  <div class="cart-sidebar" id="cart-sidebar">
    <div class="cart-header"><h3>Корзина</h3><button class="cart-close" onclick="PF.toggleCart(false)">✕</button></div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-footer" id="cart-footer" style="display:none">
      <div class="cart-total"><span>Итого</span><span id="cart-total">0 ₽</span></div>
      <button class="btn btn-primary" style="width:100%" onclick="PF.openCheckout()">Оформить заказ</button>
    </div>
  </div>

  <div class="modal-overlay" id="checkout-modal">
    <div class="modal">
      <h2>Оформление заказа</h2>
      <form id="checkout-form" onsubmit="PF.submitOrder(event)">
        <div class="form-row">
          <div class="form-group"><label>Имя</label><input type="text" name="name" required></div>
          <div class="form-group"><label>Телефон</label><input type="tel" name="phone" required></div>
        </div>
        <div class="form-group"><label>Email</label><input type="email" name="email"></div>
        <div class="form-group"><label>Адрес доставки</label><input type="text" name="address" required></div>
        <div class="form-group"><label>Комментарий</label><textarea name="comment" rows="3"></textarea></div>
        <div class="order-summary" id="checkout-summary"></div>
        <div style="display:flex;gap:12px;justify-content:flex-end">
          <button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('checkout-modal').classList.remove('open')">Отмена</button>
          <button type="submit" class="btn btn-primary">Подтвердить заказ</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="../assets/js/app.js?v=2"></script>
</body>
</html>
