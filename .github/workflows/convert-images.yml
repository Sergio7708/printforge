name: Convert product images to WebP

on:
  workflow_dispatch: {}

jobs:
  convert:
    name: Convert images to WebP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install cwebp
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Convert to WebP
        run: |
          mkdir -p product_photos_webp
          for f in product_photos/*.jpg; do
            [ -e "$f" ] || continue
            echo "Converting $f"
            cwebp -q 80 "$f" -o "product_photos_webp/$(basename "${f%.*}").webp" || true
          done

      - name: Commit and push WebP files
        run: |
          git add product_photos_webp || true
          if git diff --staged --quiet; then
            echo "No new webp files to commit"
            exit 0
          fi
          git commit -m "Add WebP copies of product images [agent]" || true
          git push origin HEAD:agent/convert-images-webp

      - name: Create PR
        uses: actions/github-script@v6
        with:
          script: |
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: 'agent/convert-images-webp',
              base: 'main',
              title: 'Add WebP copies of product images (agent)',
              body: `This PR adds WebP copies generated by the agent workflow.\n\n[agent automation]`
            });
            core.setOutput("pr_url", pr.data.html_url)
